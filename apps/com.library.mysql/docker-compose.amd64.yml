name: mysql
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped
    network_mode: bridge
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/conf.d
      target: /etc/mysql/conf.d
    - type: bind
      source: /DATA/AppData/$AppID/mysql
      target: /var/lib/mysql
x-casaos:
  title:
    en_US: Mysql
  tagline:
    en_US: MySQL is a widely used, open-source relational database management system
      (RDBMS).
  description:
    en_US: 'MySQL is a widely used, open-source relational database management system
      (RDBMS).


      ### Features

      - Simple, one-click deployment for ZimaOS and CasaOS.

      - Persistent data volume storage.

      - High-performance containerized execution.'
  category: Developer
  developer: mysql
  author: mysql
  port_map: '80'
  id: com.library.mysql
  main: mysql
  scheme: ''
  index: ''
  version: 9.7.2
  icon: https://kerklangsi.github.io/zimaos-appstore/apps/com.library.mysql/assets/icon.svg
  tips:
    en_US: Connect to database service at port 80.
  volumes:
  - container: /etc/mysql/conf.d
    description:
      en_US: Persistent storage for /etc/mysql/conf.d
  - container: /var/lib/mysql
    description:
      en_US: Persistent storage for /var/lib/mysql
