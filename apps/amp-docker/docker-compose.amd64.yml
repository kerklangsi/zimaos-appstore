name: amp-docker
services:
  amp-docker:
    image: kerklangsi/amp-docker:latest
    container_name: amp-docker
    deploy:
      resources:
        reservations:
          memory: 512M
    restart: unless-stopped
    network_mode: bridge
    environment:
    - TZ=UTC
    ports:
    - target: 8080
      published: '8080'
      protocol: tcp
    - target: 7777
      published: '7777'
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/docker.sock
      target: /var/run/docker.sock
    x-casaos:
      ports:
      - container: '8080'
        description:
          en_US: CubeCoders AMP Web Management Portal
      - container: '7777'
        description:
          en_US: CubeCoders AMP Game Port
      volumes:
      - container: /var/run/docker.sock
        description:
          en_US: Docker socket for managing game server containers
x-casaos:
  id: com.kerklangsi.amp-docker
  architectures:
  - amd64
  main: amp-docker
  port_map: '8080'
  scheme: http
  index: /
  category: Media
  author: kerklangsi
  developer: kerklangsi
  title:
    en_US: CubeCoders AMP
  tagline:
    en_US: CubeCoders AMP Game Server Manager in a Docker Container
  description:
    en_US: 'CubeCoders AMP in a Docker Image. Easily create game servers for games.


      ### Features

      - Simple, one-click deployment for ZimaOS and CasaOS.

      - Persistent data volume storage.

      - High-performance containerized execution.

      '
  tips:
    en_US: Ensure ports 8080 and 7777 are not in use before installing.
  icon: https://kerklangsi.github.io/zimaos-appstore/apps/amp-docker/assets/icon.svg
  thumbnail: https://kerklangsi.github.io/zimaos-appstore/apps/amp-docker/assets/icon.svg
  screenshot_link: []
  version: latest
  release_notes:
    en_US: '### What''s New in v1.0.0

      - Initial release of CubeCoders AMP container for ZimaOS App Store.

      - Preconfigured Docker socket binding and persistent storage for server data.

      '
  website: https://cubecoders.com/AMP
  repo: https://github.com/kerklangsi/amp-docker
  support: https://discourse.cubecoders.com/
  docs: https://docs.cubecoders.com/books/amp
  volumes:
  - container: /var/run/docker.sock
    description:
      en_US: Persistent storage for /var/run/docker.sock
