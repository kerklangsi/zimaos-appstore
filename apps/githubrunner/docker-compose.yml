name: github-runner
services:
  github-runner:
    image: kerklangsi/github-runner-docker:latest
    container_name: github-runner-docker
    network_mode: bridge
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      - REPO_URL=https://github.com/kerklangsi/your-repo
      - ACCESS_TOKEN=
      - RUNNER_TOKEN=
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/runner
        target: /opt/github-runners
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data

x-casaos:
  architectures:
    - amd64
  author: kerklangsi
  category: Developer
  description:
    en_US: |
      GitHub Runner Manager allows you to easily spawn, configure, and monitor self-hosted GitHub Actions runners directly on ZimaOS.

      ### Features:
      - **Multi-Runner Support:** Run multiple isolated GitHub runners in parallel.
      - **Live Monitoring:** View live execution logs, CPU/Memory usage, and job status from the Web UI.
      - **Persistent Storage:** Workspaces and runner states persist across container restarts.
  developer: kerklangsi
  icon: https://cdn.jsdelivr.net/gh/kerklangsi/zimaos-appstore@gh-pages/apps/com.kerklangsi.githubrunner/assets/icon.svg
  id: com.kerklangsi.githubrunner
  index: /
  main: github-runner
  port_map: "3000"
  scheme: http
  tagline:
    en_US: Multi-runner GitHub Actions manager with Web Dashboard for ZimaOS
  title:
    en_US: GitHub Runner Manager
  version: 2.0.0
  release_notes:
    en_US: |
      ### What's New in v2.0.0
      - Full ZimaOS V2 App Store integration.
      - Enhanced web dashboard with real-time log streaming.
      - Improved persistent bind mount volume support.
  tips:
    before_install:
      en_US: Make sure you have your GitHub repository URL and a Personal Access Token (PAT) or Runner Registration Token from GitHub Settings -> Actions -> Runners.
    after_install:
      en_US: Access the Web Dashboard on port 3000 (http://<your-zimaos-ip>:3000) to configure your repository connection and manage active runners.
  volumes:
    - container: /opt/github-runners
      description:
        en_US: GitHub Runners Storage
    - container: /app/data
      description:
        en_US: Application Data



