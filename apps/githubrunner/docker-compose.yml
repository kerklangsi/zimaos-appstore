name: github-runner
services:
  github-runner:
    image: kerklangsi/github-runner:latest
    container_name: github-runner
    deploy:
      resources:
        reservations:
          memory: 256M
    restart: unless-stopped
    network_mode: bridge
    tty: true
    stdin_open: true
    ports:
    - target: 3000
      published: '3000'
      protocol: tcp
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /app/data
    - type: bind
      source: /DATA/AppData/$AppID/runner
      target: /opt/github-runner
    - type: bind
      source: /DATA/AppData/$AppID/shared_data
      target: /opt/shared_data
    - type: bind
      source: /DATA/AppData/$AppID/cache
      target: /home/runner/.cache
    x-casaos:
      ports:
      - container: '3000'
        description:
          en_US: GitHub Runner Manager Web Dashboard & API Port
      volumes:
      - container: /var/run/docker.sock
        description:
          en_US: Docker daemon socket for runner container operations
      - container: /app/data
        description:
          en_US: Persistent SQLite database and manager settings
      - container: /opt/github-runner
        description:
          en_US: GitHub Runner binaries and workspace directories
      - container: /opt/shared_data
        description:
          en_US: Dedicated shared data volume for repository artifacts
      - container: /home/runner/.cache
        description:
          en_US: Unified persistent package and hosted tool cache
x-casaos:
  id: com.kerklangsi.github-runner
  architectures:
  - amd64
  - arm64
  main: github-runner
  port_map: '3000'
  scheme: http
  index: /
  category: Developer
  author: kerklangsi
  developer: kerklangsi
  title:
    en_US: GitHub Runner Manager
  tagline:
    en_US: Web GUI & Container Supervisor for GitHub Actions Self-Hosted Runners
  description:
    en_US: 'Full-stack Web GUI and Docker container manager for GitHub Actions self-hosted
      runners. Easily provision, monitor, control, and update multiple GitHub runner
      instances from a high-performance web dashboard.


      ### Features

      - Multi-runner lifecycle management with live telemetry.

      - Docker-in-Docker workflow execution with dedicated storage mounts.

      - Persistent runner diagnostics, workflow log tracking, and token locking.

      '
  tips:
    en_US: Ensure port 3000 is not in use before installing.
  icon: https://kerklangsi.github.io/zimaos-appstore/apps/githubrunner/assets/icon.svg
  thumbnail: https://kerklangsi.github.io/zimaos-appstore/apps/githubrunner/assets/icon.svg
  screenshot_link: []
  version: 4.0.2
  release_notes:
    en_US: Update to version 4.0.2
  website: https://github.com/kerklangsi/github-runner
  repo: https://github.com/kerklangsi/github-runner
  support: https://github.com/kerklangsi/github-runner/issues
  docs: https://github.com/kerklangsi/github-runner#readme
  volumes:
  - container: /var/run/docker.sock
    description:
      en_US: Persistent storage for /var/run/docker.sock
  - container: /app/data
    description:
      en_US: Persistent storage for /app/data
  - container: /opt/github-runner
    description:
      en_US: Persistent storage for /opt/github-runner
  - container: /opt/shared_data
    description:
      en_US: Persistent storage for /opt/shared_data
  - container: /home/runner/.cache
    description:
      en_US: Persistent storage for /home/runner/.cache
  is_store: true
  store_app_id: com.kerklangsi.github-runner
