name: Validate Store

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Validate and Build local dist
        run: |
          python scripts/build_dist.py

      - name: Build v2 dist with IceWhale Action
        continue-on-error: true
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
