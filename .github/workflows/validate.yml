name: Validate Store

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        run: |
          git clone --depth=1 "https://github.com/${{ github.repository }}.git" .

      - name: Install Dependencies & Validate Build
        run: |
          python3 -m pip install pyyaml --break-system-packages
          python3 scripts/build_dist.py
