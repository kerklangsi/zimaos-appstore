name: Release Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Install Dependencies & Build Store
        run: |
          python3 -m pip install pyyaml --break-system-packages
          python3 scripts/build_dist.py

      - name: Deploy to gh-pages Branch
        run: |
          rm -rf /tmp/dist_out
          cp -r dist /tmp/dist_out
          git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages
          rm -rf *
          cp -r /tmp/dist_out/* .
          touch .nojekyll
          git add -A
          git commit -m "Deploy dist from commit ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
