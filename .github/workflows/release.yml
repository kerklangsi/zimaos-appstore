name: Release Store

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Build ZimaOS Store
        run: |
          python scripts/build_dist.py

      - name: Create Zip Archives
        run: |
          cd dist && zip -r ../dist.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ZimaOS App Store Release"
          body: "Latest release of custom ZimaOS App Store assets."
          files: |
            dist.zip
            dist/appstore.zip
            dist/store.json
            dist/index.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

