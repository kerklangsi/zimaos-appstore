name: Release Store

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest)'
        required: false
        default: 'latest'
        type: string
      title:
        description: 'Release title'
        required: false
        default: 'ZimaOS App Store Release'
        type: string
      description:
        description: 'Release description / notes'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Build ZimaOS v2 Store
        run: |
          python scripts/build_dist.py

      - name: Deploy to gh-pages branch (jsDelivr CDN)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Resolve Release Version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            STORE_VER=$(python -c "import json; print(json.load(open('store-config.json')).get('store_version', '3.0.0'))")
            TAG="v${STORE_VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${{ inputs.title || '' }}" >> $GITHUB_OUTPUT

      - name: Update latest tag pointer
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.title || format('ZimaOS App Store {0}', steps.get_version.outputs.tag) }}
          body: ${{ inputs.description || format('Release {0} of custom ZimaOS App Store assets.', steps.get_version.outputs.tag) }}
          make_latest: true
          files: |
            dist/appstore.zip
            dist/store.json
            dist/index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


