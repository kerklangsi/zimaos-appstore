name: Release Store

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest)'
        required: false
        default: 'latest'
        type: string
      title:
        description: 'Release title'
        required: false
        default: 'ZimaOS App Store Release'
        type: string
      description:
        description: 'Release description / notes'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Build ZimaOS v2 Store
        run: |
          python scripts/build_dist.py

      - name: Deploy to gh-pages branch (jsDelivr CDN)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Refresh latest release
        if: ${{ (inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'latest') == 'latest' }}
        run: |
          gh release delete latest --yes || true
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'latest' }}
          name: ${{ inputs.title || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'ZimaOS App Store Release' }}
          body: ${{ inputs.description || 'Latest release of custom ZimaOS App Store assets.' }}
          generate_release_notes: ${{ inputs.description == '' && startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/appstore.zip
            dist/store.json
            dist/index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


