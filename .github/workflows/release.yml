name: Release Store

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apps.md'
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (optional, e.g. v4.1.0)'
        required: false
        default: ''
        type: string
      title:
        description: 'Release title'
        required: false
        default: 'ZimaOS App Store Release'
        type: string
      description:
        description: 'Release description / notes'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Build ZimaOS v2 Store
        run: |
          python scripts/build_dist.py

      - name: Deploy to gh-pages branch (jsDelivr CDN)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Resolve Release Version
        id: get_version
        run: |
          python scripts/release_tag.py "${{ inputs.tag }}" --ci >> $GITHUB_OUTPUT
          echo "title=${{ inputs.title || '' }}" >> $GITHUB_OUTPUT

      - name: Commit Major Version Bump
        if: steps.get_version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store-config.json README.md
          git commit -m "chore(release): bump store version to ${{ steps.get_version.outputs.tag }} [skip ci]" || true
          git push origin main || true

      - name: Update latest tag pointer
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

      - name: Generate Dynamic Release Notes
        run: |
          python scripts/release_notes.py --tag "${{ steps.get_version.outputs.tag }}" --out dist/release_notes.md

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.title || format('ZimaOS App Store {0}', steps.get_version.outputs.tag) }}
          body_path: dist/release_notes.md
          make_latest: true
          files: |
            dist/appstore.zip
            dist/store.json
            dist/index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


