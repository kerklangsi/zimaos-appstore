name: Sync Upstream Compose Files

on:
  push:
    paths:
      - 'apps.md'
  repository_dispatch:
    types: [sync-store, upstream-updated, app-release, refresh-token] # Trigger via webhook from cron-job.org or upstream repos
  workflow_dispatch: # Trigger manually from GitHub Actions tab

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Run Import & Sync Engine
        run: |
          python scripts/import.py
          python scripts/sync.py

      - name: Check for Changes & Commit
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(sync): import and sync apps from apps.md and update catalog"
            git push origin main
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected. All apps are up to date."
          fi

      - name: Store Release Status
        run: |
          if [ "${{ steps.git_status.outputs.changed }}" = "true" ]; then
            echo "Changes detected in apps! Triggering automatic store release build via push."
          else
            echo "Finished. No changes detected in any app sources. Skipping store release."
          fi
