name: github-runner-docker
services:
  github-runner:
    image: kerklangsi/github-runner-docker:latest
    container_name: github-runner-docker
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      - REPO_URL=https://github.com/kerklangsi/your-repo
      - ACCESS_TOKEN=
      - RUNNER_TOKEN=
    volumes:
      - /DATA/AppData/$AppID/runners:/opt/github-runners
      - /DATA/AppData/$AppID/data:/app/data
    restart: unless-stopped
    tty: true
    stdin_open: true

x-casaos:
  id: com.kerklangsi.githubrunner
  main: github-runner
  index: /
  port_map: "3000"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/kerklangsi/zimaos-appstore@gh-pages/apps/com.kerklangsi.githubrunner/assets/icon.svg
  title:
    en_US: GitHub Runner Manager
  tagline:
    en_US: Multi-runner GitHub Actions manager with Web Dashboard for ZimaOS
  description:
    en_US: Manage multiple self-hosted GitHub Actions runners inside a single container with live logs, resource monitoring, and web UI.
  author: kerklangsi
  developer: kerklangsi
  category: Developer
  architectures:
    - amd64
  version: 2.0.0


