name: github-runner-docker
services:
  github-runner:
    image: kerklangsi/github-runner-docker:latest
    container_name: github-runner-docker
    environment:
      - REPO_URL=https://github.com/kerklangsi/your-repo
      - RUNNER_TOKEN=
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

x-casaos:
  id: com.kerklangsi.githubrunner
  main: github-runner
  index: /
  port_map: ""
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/kerklangsi/zimaos-appstore@gh-pages/apps/com.kerklangsi.githubrunner/assets/icon.svg
  title:
    en_US: GitHub Actions Runner
  tagline:
    en_US: Self-hosted GitHub Actions runner for ZimaOS
  description:
    en_US: Run self-hosted GitHub Actions CI/CD workflows and automated jobs directly on your ZimaOS home server or homelab.
  author: kerklangsi
  developer: kerklangsi
  category: Developer
  architectures:
    - amd64
    - arm64
  version: 1.0.0
