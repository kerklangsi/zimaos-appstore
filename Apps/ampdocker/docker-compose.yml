name: amp-docker
services:
  amp-docker:
    image: kerklangsi/amp-docker:latest
    container_name: amp-docker
    network_mode: bridge
    environment:
      - TZ=UTC
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
      - target: 7777
        published: "7777"
        protocol: udp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /home/amp/.local/share/CubeCoders/AMP

x-casaos:
  architectures:
    - amd64
  author: kerklangsi
  category: Developer
  min_memory: "512MB"
  min_disk: "2000MB"
  description:
    en_US: |
      CubeCoders AMP (Application Management Panel) is a powerful, web-based management system designed specifically for hosting and managing dedicated game servers (Minecraft, Source games, Rust, Valheim, and more) directly on ZimaOS.

      ### Features:
      - **Multi-Game Support:** Manage multiple game servers from a single dashboard.
      - **Automated Management:** Built-in server updates, automated backups, and scheduled restarts.
      - **Web Interface:** Full-featured web GUI on port 8080.
      - **Dockerized Execution:** Isolated and containerized instance environment using Docker socket access.
  developer: CubeCoders / kerklangsi
  icon: https://kerklangsi.github.io/zimaos-appstore/apps/ampdocker/assets/icon.svg
  id: com.kerklangsi.ampdocker
  index: /
  main: amp-docker
  port_map: "8080"
  scheme: http
  tagline:
    en_US: Powerful Game Server Management Panel in Docker for ZimaOS
  title:
    en_US: AMP Game Server
  version: 1.0.0
  release_notes:
    en_US: |
      ### What's New in v1.0.0
      - Initial release of CubeCoders AMP container for ZimaOS App Store.
      - Preconfigured Docker socket binding and persistent storage for server data.
  tips:
    before_install:
      en_US: Ensure host ports 8080 (Web UI) and 7777 (UDP) are free. Container requires access to Docker socket (/var/run/docker.sock).
    after_install:
      en_US: "Login Info: Open the AMP Web Interface at http://<your-zimaos-ip>:8080. On first launch, follow the Web Setup Wizard to create your admin username and password."
  volumes:
    - container: /var/run/docker.sock
      description:
        en_US: Docker Socket Access
    - container: /home/amp/.local/share/CubeCoders/AMP
      description:
        en_US: AMP Game Server Data Storage
