name: amp-docker
services:
  amp-docker:
    image: kerklangsi/amp-docker:latest
    container_name: amp-docker
    environment:
      - TZ=UTC
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
      - target: 7777
        published: "7777"
        protocol: udp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/AppData/$AppID/data:/home/amp/.local/share/CubeCoders/AMP
    restart: unless-stopped

x-casaos:
  id: com.kerklangsi.ampdocker
  main: amp-docker
  index: /
  port_map: "8080"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/kerklangsi/zimaos-appstore@gh-pages/apps/com.kerklangsi.ampdocker/assets/icon.svg
  title:
    en_US: AMP Game Server
  tagline:
    en_US: CubeCoders AMP in a Docker container for game server management
  description:
    en_US: CubeCoders AMP (Application Management Panel) allows you to easily create, host, manage, and monitor dedicated game servers for various titles directly on ZimaOS.
  author: kerklangsi
  developer: CubeCoders / kerklangsi
  category: Others
  architectures:
    - amd64

  version: 1.0.0
  volumes:
    - container: /home/amp/.local/share/CubeCoders/AMP
      description:
        en_US: AMP Application Data Directory
